<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESC Dashboard | Kürşat Yılmaz</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2" style="background: rgba(10, 132, 255, 0.1);"></div>

    <nav class="glass-nav">
        <div class="container nav-content">
            <a href="index.html" class="logo" data-i18n="nav.back">← Back to Portfolio</a>
            <div class="nav-links">
                <span style="color: var(--accent-purple); font-weight: 600; margin-right: 24px;" data-i18n="eu.nav.center">ESC Operations Center</span>

                <div class="lang-switcher">
                    <button class="lang-btn" data-lang="tr">TR</button>
                    <button class="lang-btn" data-lang="en">EN</button>
                    <button class="lang-btn" data-lang="de">DE</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Secure Auth Overlay -->
    <div id="auth-overlay" class="auth-overlay active">
        <div class="glass-panel auth-card reveal active">
            <div class="face-id-icon" style="margin: 0 auto 24px auto; width: 64px; height: 64px; border: 2px solid var(--accent-blue); border-radius: 16px; position: relative;">
                <div style="position:absolute; top: 16px; left: 16px; width: 6px; height: 6px; background:var(--accent-blue); border-radius:50%;"></div>
                <div style="position:absolute; top: 16px; right: 16px; width: 6px; height: 6px; background:var(--accent-blue); border-radius:50%;"></div>
                <div style="position:absolute; bottom: 16px; left: 24px; width: 16px; height: 2px; background:var(--accent-blue); border-radius:4px;"></div>
            </div>
            <h3 style="text-align: center; margin-bottom: 8px;">Authentication Required</h3>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 32px; font-size: 0.9rem;">ESC Operations Center is restricted.</p>
            <button id="auth-btn" class="btn btn-primary btn-glow-blue" style="width: 100%;">Giriş Yap / Authenticate</button>
        </div>
    </div>

    <!-- Hidden Dashboard Layout -->
    <div class="container" id="main-dashboard" style="opacity: 0; pointer-events: none; transition: opacity 0.8s ease; max-width: 800px; padding-top: 80px; margin: 0 auto; min-height: 100vh;">
        <main class="dashboard-content">
            <!-- AI Tools -->
            <div id="ai-tools" class="card glass-panel reveal stagger-1">
                <h2 data-i18n="eu.ai.title">AI Cover Letter Generator</h2>
                <p class="subtitle" data-i18n="eu.ai.subtitle">Powered by Gemini AI API</p>
                <div id="ai-model-badge" style="display:inline-block; margin-bottom:16px; padding: 4px 12px; background: rgba(191, 90, 242, 0.2); border: 1px solid var(--accent-purple); border-radius: 99px; font-size: 0.8rem; color: #e5b3fe;">
                    Active Model: gemini-3.1-pro
                </div>

                <div class="ai-generator">
                    <label style="color: var(--text-secondary); margin-bottom: 8px; display: block;">Your Gemini API Key (Stored Locally)</label>
                    <input type="password" id="apiKeyInput" placeholder="Enter API Key (AIzaSy...)" style="width: 100%; padding: 12px; margin-bottom: 16px; border-radius: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); color: white; font-family: inherit;">

                    <label style="color: var(--text-secondary); margin-bottom: 8px; display: block;" data-i18n="eu.ai.label">Target Project URL</label>
                    <input type="url" class="ai-input url-input" placeholder="https://youth.europa.eu/solidarity/placement/..." id="aiInput" data-i18n="eu.ai.placeholder" required>

                    <button class="btn btn-primary btn-glow-purple" id="generateBtn" style="width: 100%;" data-i18n="eu.ai.btn.gen">
                        Generate Tailored Cover Letter ✨
                    </button>

                    <div class="ai-output" id="aiOutput" style="display: none; opacity: 0; transition: opacity 0.5s;">
                        <p style="color: var(--text-secondary); margin-bottom: 16px;"><em data-i18n="eu.ai.output">Generated Draft:</em></p>
                        <div id="generatedText" style="line-height: 1.8; padding: 16px; background: rgba(0,0,0,0.3); border-radius: 12px;"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/ai.js"></script>
    <script>
        // Auth Logic
        document.getElementById('auth-btn').addEventListener('click', function() {
            const btn = this;
            btn.innerHTML = 'Authenticating... <span style="animation: pulse 1s infinite;">⏳</span>';
            btn.style.opacity = '0.7';

            setTimeout(() => {
                const overlay = document.getElementById('auth-overlay');
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.display = 'none';
                    const mainDash = document.getElementById('main-dashboard');
                    mainDash.style.opacity = '1';
                    mainDash.style.pointerEvents = 'auto';
                }, 500);
            }, 1200);
        });

    </script>
</body>
</html>
